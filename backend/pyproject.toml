[project]
name = "loadcad"
version = "0.1.0"
description = "Pre-MVP headless CAD, mesh, and linear-static FEA proof for an L-bracket."
requires-python = ">=3.11"
dependencies = [
    "build123d",
    "gmsh",
    "meshio",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
